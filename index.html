<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Volleyball Management System</title>
  <link rel="stylesheet" href="assets/css/main.css" />
</head>
<body>
  <div class="vms-loading-overlay">
    <div class="vms-loading-spinner">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <p class="mt-2 mb-0 text-muted small">Loading Volleyball Management System...</p>
    </div>
  </div>

  <!--
    Entry point: this page has no content of its own. It checks auth state
    and forwards the visitor to the correct page — this keeps the redirect
    logic in one place instead of duplicating it on every page.
  -->
  <script type="module">
    import { watchAuthState } from "./assets/js/services/auth-service.js";

    const unsubscribe = watchAuthState((state) => {
      unsubscribe();
      window.location.href = state && state.user ? "pages/dashboard.html" : "pages/login.html";
    });
  </script>
</body>
</html>
