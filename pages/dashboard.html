<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard · Volleyball Management System</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  <!-- FullCalendar -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.15/main.min.css" />
  <!-- App styles -->
  <link rel="stylesheet" href="../assets/css/main.css" />
</head>
<body>

  <div class="app-shell">
    <div class="sidebar-backdrop"></div>
    <aside class="app-sidebar" id="appSidebar"><!-- injected by sidebar.js --></aside>

    <div class="app-main">
      <header class="app-navbar" id="appNavbar"><!-- injected by navbar.js --></header>

      <main class="app-content">

        <!-- Stat cards -->
        <div class="row g-3 mb-3" id="statCardsRow">
          <!-- injected by dashboard.js -->
        </div>

        <div class="row g-3 mb-3">
          <!-- Player registrations chart -->
          <div class="col-lg-8">
            <div class="section-card h-100">
              <div class="section-card-title">
                <span>Registrations Over Time</span>
                <select class="form-select form-select-sm w-auto" id="registrationsRangeSelect">
                  <option value="6">Last 6 months</option>
                  <option value="12" selected>Last 12 months</option>
                </select>
              </div>
              <canvas id="registrationsChart" height="110"></canvas>
            </div>
          </div>

          <!-- League standings snapshot -->
          <div class="col-lg-4">
            <div class="section-card h-100">
              <div class="section-card-title"><span>Match Results Split</span></div>
              <canvas id="matchStatsChart" height="200"></canvas>
            </div>
          </div>
        </div>

        <div class="row g-3 mb-3">
          <!-- Upcoming matches / calendar -->
          <div class="col-lg-7">
            <div class="section-card h-100">
              <div class="section-card-title"><span>Match Calendar</span></div>
              <div id="dashboardCalendar"></div>
            </div>
          </div>

          <!-- Recent activity -->
          <div class="col-lg-5">
            <div class="section-card h-100">
              <div class="section-card-title"><span>Recent Activity</span></div>
              <div id="activityFeed">
                <!-- injected by dashboard.js -->
              </div>
            </div>
          </div>
        </div>

        <div class="row g-3">
          <div class="col-12">
            <div class="section-card">
              <div class="section-card-title">
                <span>Upcoming Matches</span>
                <span class="badge text-bg-secondary">Sample data — connect Firestore in Phase 3</span>
              </div>
              <div class="table-responsive">
                <table class="table table-hover align-middle mb-0" id="upcomingMatchesTable" style="width:100%">
                  <thead>
                    <tr>
                      <th>Date</th>
                      <th>Home Team</th>
                      <th>Away Team</th>
                      <th>Venue</th>
                      <th>Competition</th>
                      <th>Status</th>
                    </tr>
                  </thead>
                  <tbody><!-- injected by dashboard.js --></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- Bootstrap JS bundle (Popper included) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <!-- FullCalendar -->
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.15/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/daygrid@6.1.15/index.global.min.js"></script>
  <!-- DataTables -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" />
  <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>

  <!-- App entry point for this page -->
  <script type="module" src="../assets/js/pages/dashboard.js"></script>
</body>
</html>
